[plugin]

name="gs-audio"
description="A game audio system that ships no audio: a catalogue of ids to paths, pooled players with priority-based voice stealing, cooldowns and per-id caps, buses and a mixer that is a GSConfig, music with crossfades and stem layers, and a sink interface so the whole path runs headless. Depends only on gs-core."
author="dot"
version="0.1.0"
script="gs_audio_plugin.gd"
